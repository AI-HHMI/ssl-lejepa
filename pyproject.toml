[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl-lejepa"
version = "0.1.0"
description = "LeJEPA SSL for microsocopy"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "miao-io>=0.4.0",
    "lmd-catalog",
    "zarr>=2.16",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
analysis = [
    "pandas",  # analysis.py, analysis_plots.py, reports/ (charts: plots_interactive, plotly.js from a CDN)
    "scipy",  # pandas' corr(method="spearman")
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.uv]
# Lock only for the machines we use: local Macs and the Janelia cluster.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
lmd-catalog = { git = "https://github.com/AI-HHMI/lmd-catalog", branch = "main" }
miao-io = { git = "https://github.com/AI-HHMI/miao.git", branch = "master" }
# lmd-catalog = { path = "../lmd-data-versioning", editable = true }
# miao-io = { path = "../miao", editable = true }

[tool.pytest.ini_options]
testpaths = ["lib/tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
include = ["lib"]
venvPath = "."
venv = ".venv"

